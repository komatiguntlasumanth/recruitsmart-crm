spring.application.name=recruitsmart-crm
spring.main.banner-mode=off
spring.main.lazy-initialization=true
spring.main.allow-bean-definition-overriding=true
spring.jmx.enabled=false
spring.main.banner-mode=off

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/recruitsmartdb?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection resilience (Do not crash if DB is starting up)
spring.datasource.hikari.initialization-fail-timeout=0
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Size & POST Limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.tomcat.max-http-post-size=20MB
server.tomcat.max-swallow-size=20MB
server.max-http-header-size=64KB

# Server Port (Required for Railway)
# Server Port & Address (Required for Railway)
server.port=${PORT:7860}
server.address=0.0.0.0
# CORS (Allow Vercel)
cors.allowed.origins=${FRONTEND_URL:http://localhost:5173}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.db.enabled=false
management.health.mail.enabled=false
spring.mail.test-connection=false
spring.jpa.open-in-view=false
management.metrics.export.simple.enabled=false
management.metrics.enable.all=false
management.info.defaults.enabled=false
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=30000
server.tomcat.max-threads=10
server.tomcat.accept-count=10
server.tomcat.max-connections=1000
spring.jpa.hibernate.ddl-auto=update
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=2000
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=true
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.generate_statistics=false

# AI & Gemini Configuration
gemini.api.key=${GEMINI_API_KEY:AIzaSyBQSqWsfbZvTezhw391QTRUZd_FNedyD7s}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
gemini.embedding.url=https://generativelanguage.googleapis.com/v1beta/models/text-embedding-004:embedContent

# Email Configuration Defaults
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=komatiguntlasumanths@gmail.com
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Keep-Alive Configuration
app.keep-alive.enabled=${KEEP_ALIVE_ENABLED:false}
spring.datasource.hikari.initialization-fail-timeout=0
