spring.application.name=recruitsmart-crm
spring.datasource.url=jdbc:${DATABASE_URL:mysql://localhost:3306/recruitsmartdb}?autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# File Size & POST Limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.tomcat.max-http-post-size=20MB
server.tomcat.max-swallow-size=20MB
server.max-http-header-size=64KB

# Server Port (Required for Railway)
server.port=${PORT:8080}
# CORS (Allow Vercel)
cors.allowed.origins=${FRONTEND_URL:http://localhost:5173}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.mail.test-connection=false
spring.main.lazy-initialization=true
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=2
server.tomcat.max-threads=15
spring.jpa.hibernate.ddl-auto=none
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.generate_statistics=false

# AI & Gemini Configuration
gemini.api.key=YOUR_GEMINI_API_KEY_HERE
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
gemini.embedding.url=https://generativelanguage.googleapis.com/v1beta/models/text-embedding-004:embedContent
