spring.application.name=recruitsmart-crm
spring.main.banner-mode=off
spring.main.lazy-initialization=true
spring.main.allow-bean-definition-overriding=true
spring.datasource.url=jdbc:${DATABASE_URL:mysql://localhost:3306/recruitsmartdb}?autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# File Size & POST Limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.tomcat.max-http-post-size=20MB
server.tomcat.max-swallow-size=20MB
server.max-http-header-size=64KB

# Server Port (Required for Railway)
server.port=${PORT:8080}
# CORS (Allow Vercel)
cors.allowed.origins=${FRONTEND_URL:http://localhost:5173}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.db.enabled=false
management.health.mail.enabled=false
spring.mail.test-connection=false
spring.jpa.open-in-view=false
management.metrics.export.simple.enabled=false
management.metrics.enable.all=false
management.info.defaults.enabled=false
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
server.tomcat.max-threads=10
server.tomcat.accept-count=10
server.tomcat.max-connections=1000
spring.jpa.hibernate.ddl-auto=update
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.connection-timeout=10000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=false

# AI & Gemini Configuration
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
gemini.embedding.url=https://generativelanguage.googleapis.com/v1beta/models/text-embedding-004:embedContent

# Email Configuration Defaults
spring.mail.host=smtp.gmail.com
spring.mail.port=587
