spring.application.name=recruitsmart-crm
spring.main.banner-mode=off
spring.main.lazy-initialization=true
spring.main.allow-bean-definition-overriding=true
spring.jmx.enabled=false
spring.main.banner-mode=off

# Database Configuration (Optimized for Railway Internal Networking)
spring.datasource.url=jdbc:mysql://${MYSQLHOST:private.database.internal}:${MYSQLPORT:3306}/${MYSQLDATABASE:recruitsmartdb}?autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=10000&socketTimeout=60000
spring.datasource.username=${MYSQLUSER:${DATABASE_USERNAME:root}}
spring.datasource.password=${MYSQLPASSWORD:${DATABASE_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection resilience (Do not crash if DB is starting up)
spring.datasource.hikari.initialization-fail-timeout=0

spring.jpa.show-sql=false
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Size & POST Limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.tomcat.max-http-post-size=20MB
server.tomcat.max-swallow-size=20MB
server.max-http-header-size=64KB

# Server Port (Required for Railway)
# Server Port & Address (Required for Railway)
server.port=${PORT:7860}
server.address=0.0.0.0
# CORS (Allow Vercel)
cors.allowed.origins=${FRONTEND_URL:http://localhost:5173}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.db.enabled=false
management.health.mail.enabled=false
spring.mail.test-connection=false
spring.jpa.open-in-view=false
management.metrics.export.simple.enabled=false
management.metrics.enable.all=false
management.info.defaults.enabled=false
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
server.tomcat.max-threads=10
server.tomcat.accept-count=10
server.tomcat.max-connections=1000
spring.jpa.hibernate.ddl-auto=update
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-timeout=60000
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=false

# AI & Gemini Configuration
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
gemini.embedding.url=https://generativelanguage.googleapis.com/v1beta/models/text-embedding-004:embedContent

# Email Configuration Defaults
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=komatiguntlasumanths@gmail.com
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Keep-Alive Configuration
app.keep-alive.enabled=${KEEP_ALIVE_ENABLED:false}
spring.datasource.hikari.initialization-fail-timeout=0
