# Primary Datasource (H2 for local development)
# To use MySQL, set DATABASE_URL, DATABASE_USERNAME, and DATABASE_PASSWORD or use -Dspring.profiles.active=mysql
spring.datasource.url=${DB_URL:jdbc:h2:mem:recruitsmartdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=org.h2.Driver

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Hibernate 6 auto-detects the dialect, so we can omit it for multi-DB support
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# File Size & POST Limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.tomcat.max-http-post-size=20MB
server.tomcat.max-swallow-size=20MB
server.max-http-header-size=64KB

# Server Port (Required for Railway)
server.port=${PORT:8080}
# CORS (Allow Vercel)
cors.allowed.origins=${FRONTEND_URL:http://localhost:5173,http://10.0.2.2:5173,https://recruitsmart.netlify.app}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
spring.mail.test-connection=false

