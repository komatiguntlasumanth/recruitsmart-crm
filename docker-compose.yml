version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: recruitsmart-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-recruitsmart_db}
      MYSQL_USER: ${MYSQL_USER:-recruitsmart}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-recruitsmart123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - recruitsmart-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recruitsmart-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-recruitsmart_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-recruitsmart}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-recruitsmart123}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-this-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - recruitsmart-network
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recruitsmart-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - recruitsmart-network
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}

volumes:
  mysql_data:
    driver: local

networks:
  recruitsmart-network:
    driver: bridge
